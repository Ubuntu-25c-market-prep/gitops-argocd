# gitops-argocd/clusters/dev/25c-shared/kustomization.yaml
#
# THE PER-CLUSTER ENTRYPOINT. This is the path Flux's bootstrap Application
# points at for this cluster (ADR 0015), and it answers exactly one question:
#
#   what does THIS cluster's Argo CD reconcile?
#
# It mirrors gitops-flux/clusters/<env>/<cluster>/ deliberately. Adding a second
# cluster is a sibling directory - a new folder that names its own environments -
# and nothing in base/ or apps/ changes. That is the property being bought here,
# and it is why this file exists while there is only one cluster to point it at.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AppProjects and ApplicationSets both live in the namespace the Argo CD
# controller runs in.
namespace: argocd

resources:
  # The security boundary. Every cluster gets it; it is not environment-specific.
  - ../../../projects/base

  # DEV ONLY at this stage (gitops-argocd#13). The team is working in dev; stage
  # and prod are to hold no running workloads until that changes.
  #
  # This is the same mechanism a dedicated prod cluster would use, pointed the
  # other way. That cluster would list only applicationsets/base/prod here and be
  # incapable of running a dev workload - not by policy, but because the
  # generator that would create one is not installed on it. This cluster is
  # currently incapable of producing a stage or prod Application for exactly the
  # same reason.
  #
  # RESTORING: uncomment the two lines below. Nothing else changes - the
  # ApplicationSets, the overlays and the promotion path all still exist in this
  # repository, they are simply not installed here. gitops-argocd#2 and #4 remain
  # delivered work.
  #
  # Note the two do NOT behave alike on removal, and the difference is
  # deliberate. The stage Application carries resources-finalizer, so dropping
  # its ApplicationSet prunes the workload with it. The prod ApplicationSet sets
  # preserveResourcesOnDeletion and omits that finalizer, so a git change can
  # never delete production - which also means the prod workload had to be
  # removed by hand before this landed, rather than by this file.
  - ../../../applicationsets/base/dev
  # - ../../../applicationsets/base/stage
  # - ../../../applicationsets/base/prod

# Stamps the cluster name onto the AppProject and ApplicationSets, so an object
# in the argocd namespace says which cluster's entrypoint created it.
#
# Deliberately NOT an environment label. The environment of a workload is set
# per generated Application by the ApplicationSet template, and this cluster is
# built to host dev, stage and prod at once (ADR 0002) even though only dev is
# installed today - so a cluster-level environment label would be wrong the
# moment the other two are restored.
labels:
  - includeSelectors: false
    pairs:
      u25c.io/cluster: 25c-shared
