# gitops-argocd/apps/storefront/overlays/stage
#
# Deliberately identical to dev apart from the namespace and the tag. Stage
# exists to run the exact image that is about to reach prod, under the same
# constraints it met in dev. A stage that is quietly roomier than dev tests
# nothing, and a stage that is quietly smaller fails for reasons prod never
# will.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-stage

resources:
  - ../../base

images:
  - name: storefront
    # No `newName` here, deliberately. The registry host is
    # <account-id>.dkr.ecr.us-east-1.amazonaws.com and this repository is public,
    # so the account id stays out of git (engineering handbook; and gitops-flux
    # does the same for every IRSA ARN - see gitops-flux#97).
    #
    # The ApplicationSet supplies the full reference at sync time by reading
    # `newTag` out of THIS FILE and prepending the registry, which it gets from
    # an annotation on the cluster Secret. See applicationsets/business-apps.yaml.
    #
    # `kustomize build` here therefore renders `storefront:<tag>` - a name with
    # no registry, which is obviously not deployable. That is intentional: a
    # placeholder that looks real is worse than one that does not.
    # ─── PROMOTION HAPPENS HERE ───────────────────────────────────────────
    # dev -> stage is a pull request that copies dev's tag onto this line.
    # Never edit base to promote. Never sync from the Argo UI - a UI sync that
    # is not in git is reverted at the next reconcile, silently.
    newTag: "0.1.0"

replicas:
  - name: storefront
    count: 1
